{{- /* Reading progress bar — only on single posts, where "how much is left?" is a real question. */ -}}
{{- if and (eq .Kind "page") (.Param "ShowReadingTime") }}
<style>
  .read-progress {
    position: fixed;
    top: 0;
    inset-inline-start: 0;
    height: 2px;
    width: 0;
    background: var(--accent);
    z-index: 100;
    transition: width 90ms linear;
    pointer-events: none;
  }
  @media (prefers-reduced-motion: reduce) { .read-progress { transition: none; } }
  @media print { .read-progress { display: none; } }
</style>
<div class="read-progress" id="read-progress" role="presentation"></div>
<script>
  (function () {
    var bar = document.getElementById('read-progress');
    var article = document.querySelector('.post-content');
    if (!bar || !article) return;
    var ticking = false;
    function update() {
      var rect = article.getBoundingClientRect();
      var total = rect.height - window.innerHeight;
      var pct = total <= 0 ? 100 : ((-rect.top) / total) * 100;
      bar.style.width = Math.min(100, Math.max(0, pct)) + '%';
      ticking = false;
    }
    function onScroll() {
      if (!ticking) { window.requestAnimationFrame(update); ticking = true; }
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll, { passive: true });
    update();
  })();
</script>
{{- end }}
